<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>

  <!-- Inline theme init: runs synchronously before first paint to prevent flash -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('dashboard_theme');
        var theme = stored ? JSON.parse(stored) : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting + Theme Toggle ===== -->
  <header class="header">
    <div id="greeting-widget" class="greeting-widget">
      <div class="greeting-widget__clock-row">
        <span id="clock" class="greeting-widget__clock">00:00:00</span>
        <span id="date" class="greeting-widget__date">Loading…</span>
      </div>
      <div class="greeting-widget__name-row">
        <span id="greeting-text" class="greeting-widget__text">Good morning</span>
        <span class="greeting-widget__name-wrapper">
          <span
            id="username-display"
            class="greeting-widget__username"
            title="Click to edit your name"
            role="button"
            tabindex="0"
            aria-label="Edit your name"
          ></span>
          <input
            id="username-input"
            class="greeting-widget__username-input hidden"
            type="text"
            maxlength="40"
            placeholder="Your name"
            aria-label="Enter your name"
          />
        </span>
      </div>
    </div>

    <button
      id="theme-toggle"
      class="theme-toggle"
      aria-label="Toggle light/dark theme"
      title="Toggle theme"
    >
      <span id="theme-icon" aria-hidden="true">☀️</span>
    </button>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- Timer Widget -->
    <section id="timer-widget" class="widget" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="widget__title">Timer</h2>

      <!-- Mode tabs -->
      <div class="timer__tabs" role="tablist" aria-label="Timer mode">
        <button id="tab-pomodoro" class="timer__tab timer__tab--active" role="tab" aria-selected="true" aria-controls="panel-pomodoro">Pomodoro</button>
        <button id="tab-stopwatch" class="timer__tab" role="tab" aria-selected="false" aria-controls="panel-stopwatch">Stopwatch</button>
      </div>

      <!-- Pomodoro panel -->
      <div id="panel-pomodoro" class="timer__panel" role="tabpanel" aria-labelledby="tab-pomodoro">

        <!-- Pomodoro mode buttons -->
        <div class="pomo__modes" role="group" aria-label="Pomodoro mode">
          <button id="pomo-work"        class="pomo__mode-btn pomo__mode-btn--active" data-mode="work"        aria-pressed="true">Work</button>
          <button id="pomo-short-break" class="pomo__mode-btn"                        data-mode="short-break" aria-pressed="false">Short Break</button>
          <button id="pomo-long-break"  class="pomo__mode-btn"                        data-mode="long-break"  aria-pressed="false">Long Break</button>
        </div>

        <!-- Session counter -->
        <div class="pomo__session-row">
          <span class="pomo__session-label">Sessions completed:</span>
          <span id="pomo-session-count" class="pomo__session-count">0</span>
          <button id="pomo-session-reset" class="btn btn--sm" aria-label="Reset session count" title="Reset session count">↺</button>
        </div>

        <div id="timer-display" class="timer__display">25:00</div>

        <div class="timer__controls">
          <button id="timer-start" class="btn btn--accent" aria-label="Start timer">Start</button>
          <button id="timer-stop"  class="btn"             aria-label="Stop timer">Stop</button>
          <button id="timer-reset" class="btn"             aria-label="Reset timer">Reset</button>
        </div>

        <!-- Custom duration -->
        <div class="timer__duration-row">
          <label for="timer-duration-input" class="timer__duration-label">Custom (min):</label>
          <input
            id="timer-duration-input"
            class="timer__duration-input"
            type="number"
            min="1"
            max="120"
            value="25"
            aria-label="Timer duration in minutes"
          />
          <button id="timer-duration-set" class="btn btn--sm" aria-label="Set timer duration">Set</button>
        </div>
      </div>

      <!-- Stopwatch panel -->
      <div id="panel-stopwatch" class="timer__panel hidden" role="tabpanel" aria-labelledby="tab-stopwatch">
        <div id="stopwatch-display" class="timer__display">00:00:00</div>

        <div class="timer__controls">
          <button id="sw-start" class="btn btn--accent" aria-label="Start stopwatch">Start</button>
          <button id="sw-stop" class="btn" aria-label="Stop stopwatch">Stop</button>
          <button id="sw-reset" class="btn" aria-label="Reset stopwatch">Reset</button>
        </div>
      </div>
    </section>

    <!-- To-Do List Widget -->
    <section id="todo-widget" class="widget" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="widget__title">To-Do List</h2>

      <form id="todo-form" class="todo-form" novalidate>
        <input
          id="todo-input"
          class="todo-form__input"
          type="text"
          placeholder="Add a new task…"
          maxlength="200"
          aria-label="New task description"
          autocomplete="off"
        />
        <button type="submit" class="btn btn--accent" aria-label="Add task">Add</button>
      </form>

      <!-- Duplicate warning -->
      <div id="todo-duplicate-msg" class="todo-duplicate-msg hidden" role="alert" aria-live="assertive">
        ⚠ Task already exists
      </div>

      <!-- Sort controls -->
      <div class="todo-sort-row">
        <label for="todo-sort" class="todo-sort-label">Sort:</label>
        <select id="todo-sort" class="todo-sort-select" aria-label="Sort tasks">
          <option value="default">Default (added order)</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="pending">Pending first</option>
          <option value="done">Done first</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Task list" aria-live="polite"></ul>
    </section>

    <!-- Quick Links Widget -->
    <section id="links-widget" class="widget" aria-labelledby="links-heading">
      <h2 id="links-heading" class="widget__title">Quick Links</h2>

      <form id="links-form" class="links-form" novalidate>
        <input
          id="links-label-input"
          class="links-form__input"
          type="text"
          placeholder="Label"
          maxlength="40"
          aria-label="Link label"
          autocomplete="off"
        />
        <input
          id="links-url-input"
          class="links-form__input"
          type="url"
          placeholder="https://example.com"
          maxlength="500"
          aria-label="Link URL"
          autocomplete="off"
        />
        <button type="submit" class="btn btn--accent" aria-label="Add quick link">Add</button>
      </form>

      <div id="links-list" class="links-list" aria-label="Quick links" aria-live="polite"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
